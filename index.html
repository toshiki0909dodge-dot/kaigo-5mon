<html lang="ja">
<head>

<title>介護福祉士 毎日5問</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Kiwi+Maru:wght@500&family=Quicksand:wght@600;700&display=swap">
<style>
/* Layout: a soft study diary — one rounded column, flower stamps for progress, tabs pinned to the bottom. */
:root{
  --bg:#FFF6F7; --bg2:#FDEBEF; --surface:#FFFFFF; --ink:#4A3A42; --muted:#8C7780; --line:#F3DCE2;
  --accent:#E5678C; --accent-ink:#FFFFFF; --accent-soft:#FDE4EB;
  --mint:#4FB39B; --mint-soft:#E1F5EF; --lilac:#A890DC; --lilac-soft:#EFE9FB;
  --marker:#FFF1B8; --marker-ink:#5A4A2A; --sun:#F6B83F;
  --ok:#3FA287; --ok-bg:#E3F5EF; --ng:#E0607A; --ng-bg:#FDE8EC;
  --shadow:0 6px 18px rgba(229,103,140,.10);
  --font-display:"Kiwi Maru","Zen Maru Gothic","Hiragino Maru Gothic ProN",serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-num:"Quicksand","Zen Maru Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#21181D; --bg2:#2A1E25; --surface:#2C2128; --ink:#F6E8EE; --muted:#C3A9B5; --line:#45333D;
  --accent:#FF8FB0; --accent-ink:#2A1720; --accent-soft:#4A2D3A;
  --mint:#7DD6BE; --mint-soft:#1F3A33; --lilac:#C6B3F2; --lilac-soft:#352D4A;
  --marker:#5A4B22; --marker-ink:#FFF3C4; --sun:#F7C766;
  --ok:#7DD6BE; --ok-bg:#1F3A33; --ng:#FF8FA3; --ng-bg:#472631;
  --shadow:0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#21181D; --bg2:#2A1E25; --surface:#2C2128; --ink:#F6E8EE; --muted:#C3A9B5; --line:#45333D;
  --accent:#FF8FB0; --accent-ink:#2A1720; --accent-soft:#4A2D3A;
  --mint:#7DD6BE; --mint-soft:#1F3A33; --lilac:#C6B3F2; --lilac-soft:#352D4A;
  --marker:#5A4B22; --marker-ink:#FFF3C4; --sun:#F7C766;
  --ok:#7DD6BE; --ok-bg:#1F3A33; --ng:#FF8FA3; --ng-bg:#472631;
  --shadow:0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
button{-webkit-appearance:none;appearance:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--bg2) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:calc(18px + env(safe-area-inset-top,0px)) 110px}
header.top{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-family:var(--font-display);font-weight:500;font-size:21px;line-height:1.3;margin:0;letter-spacing:.03em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.countdown{display:flex;align-items:center;gap:12px;border-radius:20px;padding:12px 18px;background:linear-gradient(115deg,var(--accent),var(--lilac));color:var(--accent-ink);box-shadow:var(--shadow)}
.countdown .lbl{display:flex;flex-direction:column;font-size:13px;font-weight:700;line-height:1.35}
.countdown .lbl small{font-size:11px;font-weight:500;opacity:.9}
.countdown .num{margin-left:auto;display:flex;align-items:baseline;gap:4px;font-weight:700;font-size:15px;white-space:nowrap}
.countdown .num b{font-family:var(--font-num);font-size:44px;line-height:1;letter-spacing:-.01em}
.countdown.today{justify-content:center;font-size:15px;font-weight:700}
.countdown.set{width:100%;font:inherit;font-size:13px;font-weight:700;border:2px dashed var(--accent);background:var(--surface);color:var(--accent);box-shadow:none;justify-content:center;cursor:pointer}
.greet{background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.greet>svg{flex:none}
.greet .msg{flex:1;min-width:0;font-size:12px;line-height:1.6;text-wrap:balance}
.greet .msg b{display:block;font-size:13px;color:var(--accent)}
.meta{display:flex;gap:6px;flex:none}
.meta div{background:var(--accent-soft);border-radius:12px;padding:5px 6px;text-align:center;font-size:10px;color:var(--muted);min-width:52px;line-height:1.3}
.meta div:nth-child(2){background:var(--lilac-soft)}
.meta b{display:block;font-family:var(--font-num);font-size:17px;color:var(--ink);font-weight:700;line-height:1.2}
.sync{font-size:12px;color:var(--ng)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;width:100%;background:var(--surface);border-radius:24px;box-shadow:0 8px 24px rgba(120,60,80,.16);padding:6px;pointer-events:auto}
nav.tabs button{background:none;border:0;border-radius:18px;padding:6px 2px 5px;font:inherit;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs .badge{position:absolute;top:2px;right:18%;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:18px;font-family:var(--font-num)}
h2.sec{font-family:var(--font-display);font-weight:500;font-size:20px;margin:0;text-wrap:balance;display:flex;align-items:center;gap:8px}
h3{font-size:16px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:15px;font-weight:700;border-radius:999px;padding:11px 22px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 4px 0 rgba(180,60,95,.25);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(180,60,95,.25)}
.btn.ghost{background:var(--surface);color:var(--accent);box-shadow:none}
.btn.quiet{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:focus-visible,nav.tabs button:focus-visible,.choice:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.chip{display:inline-block;font-size:12px;padding:2px 12px;border-radius:999px;background:var(--lilac-soft);color:var(--ink);font-weight:700}
.chip.ai{background:var(--marker);color:var(--marker-ink)}
.chip.pink{background:var(--accent-soft);color:var(--accent)}
.pips{display:flex;gap:5px}
.pip{width:18px;height:18px;color:var(--line);display:inline-block}.pip svg{width:100%;height:100%;display:block}
.pip.ok{color:var(--ok)}.pip.ng{color:var(--ng)}.pip.cur{color:var(--accent)}
.pip.cur svg path{fill:none;stroke:currentColor;stroke-width:2.4}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--font-num);font-weight:700;font-size:13px;color:var(--muted)}
.qno b{color:var(--accent);font-size:18px}
.stem{font-size:16px;line-height:1.9;margin:2px 0 6px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:11px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .n{font-family:var(--font-num);font-weight:700;width:28px;height:28px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:14px;color:var(--muted);margin-top:0}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-pressed="true"] .n{background:var(--accent);color:var(--accent-ink)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.right .n{background:var(--ok);color:var(--surface)}
.choice.wrong{border-color:var(--ng);background:var(--ng-bg)}
.choice.wrong .n{background:var(--ng);color:var(--surface)}
.choice:disabled{cursor:default;opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.hint{background:var(--marker);color:var(--marker-ink);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.hint svg{flex:none;margin-top:2px}
.verdict{border-radius:18px;padding:16px;font-size:14px;position:relative}
.verdict.ok{background:var(--ok-bg)}.verdict.ng{background:var(--ng-bg)}
.verdict strong.v{display:block;font-size:14px;margin-bottom:2px}
.verdict.ok strong.v{color:var(--ok)}.verdict.ng strong.v{color:var(--ng)}
.score{display:flex;align-items:baseline;gap:6px;font-family:var(--font-num);font-weight:700}
.score b{font-size:52px;line-height:1;color:var(--accent)}
.result-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stamp{width:104px;height:104px;border-radius:50%;border:3px solid var(--accent);color:var(--accent);display:grid;place-items:center;text-align:center;font-family:var(--font-display);font-size:15px;line-height:1.3;transform:rotate(-12deg);position:relative;flex:none}
.stamp::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px dashed var(--accent)}
.stamp.mint{border-color:var(--mint);color:var(--mint)}.stamp.mint::after{border-color:var(--mint)}
.stamp.lilac{border-color:var(--lilac);color:var(--lilac)}.stamp.lilac::after{border-color:var(--lilac)}
.reslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.reslist li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 0;border-top:2px dotted var(--line)}
.mark{font-weight:700;font-size:17px}.mark.ok{color:var(--ok)}.mark.ng{color:var(--ng)}
details{border-top:2px dotted var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent)}
.notes ul{margin:8px 0 0;padding-left:1.2em}
.notes li{margin:5px 0}
.notes li::marker{color:var(--accent)}
.subjsec{display:flex;flex-direction:column;gap:12px}
.subjsec .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wq{border-top:2px dotted var(--line);padding-top:12px;font-size:14px}
.wq .ans{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.wq .ans span b{font-family:var(--font-num)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.4em;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--lilac),var(--accent));border-radius:5px}
.bar .pct{font-family:var(--font-num);font-weight:700;text-align:right;color:var(--muted)}
.garden{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.plot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-family:var(--font-num)}
.plot svg{width:100%;max-width:40px;height:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:center}
.kpi:nth-child(1){background:var(--accent-soft)}.kpi:nth-child(2){background:var(--lilac-soft)}.kpi:nth-child(3){background:var(--mint-soft)}
.kpi b{display:block;font-family:var(--font-num);font-size:26px;font-weight:700;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=time],input[type=date]{font:inherit;font-size:16px;padding:8px 12px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.status{font-size:13px;padding:10px 12px;border-radius:14px;background:var(--mint-soft)}
.status.err{background:var(--ng-bg);color:var(--ng)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty svg{display:block;margin:0 auto 8px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (max-width:420px){.kpi b{font-size:22px}.bar{grid-template-columns:minmax(0,7em) 1fr 3em}.stamp{width:88px;height:88px;font-size:13px}.score b{font-size:44px}}
@media (max-width:360px){.greet{padding:10px 12px;gap:8px}.greet .msg{font-size:11px}.greet .msg b{font-size:12px}.meta div{min-width:44px;padding:4px 5px}.meta b{font-size:15px}.verdict strong.v{font-size:13px}}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .3s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.6) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
  .bounce{animation:bounce .5s cubic-bezier(.3,1.6,.5,1)}@keyframes bounce{from{transform:scale(.9)}to{transform:scale(1)}}
}
</style>

<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--accent-soft)"/><g fill="var(--accent)"><circle cx="20" cy="13" r="5"/><circle cx="27" cy="18" r="5"/><circle cx="24.5" cy="26" r="5"/><circle cx="15.5" cy="26" r="5"/><circle cx="13" cy="18" r="5"/></g><circle cx="20" cy="20" r="4" fill="var(--sun)"/></svg>
      <div><h1>介護福祉士 毎日5問</h1><p id="today-label"></p></div>
    </div>
    <div id="countdown"></div>
    <div class="greet" id="greet"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="画面切り替え"><div class="in" id="tabs"></div></nav>
<canvas id="confetti" aria-hidden="true" hidden></canvas>
<script src="questions.js"></script>

<script>

/* 問題データは questions.js（SUBJ と BANK_RAW）
   選択肢の並びは問題ごとに固定の順番で入れ替え、正解の位置が偏らないようにする */
const BANK = BANK_RAW.map(a=>{
  const perm=shuffle([0,1,2,3,4],rng(hashStr("ch:"+a[0])));
  return {id:a[0],subj:a[1],q:a[2],ch:perm.map(i=>a[3][i]),ans:perm.indexOf(a[4]),hint:a[5],ex:a[6]};
});

/* ---------------- 状態と保存 ---------------- */
const LS_KEY = "kaigo5-state-v1";
function fresh(){return {
  st:{progress:{},days:{},settings:{examDate:""},updatedAt:0},
};}
let S = fresh();
try{const raw=localStorage.getItem(LS_KEY); if(raw){const o=JSON.parse(raw); if(o&&o.st) S=Object.assign(fresh(),o);}}catch(e){}

let db=null, uid=null, syncNote="";
const refs={};
const timers={}, chains={};
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
function persist(part){
  S[part].updatedAt=Date.now(); saveLocal();
  if(!refs[part]) return;
  clearTimeout(timers[part]);
  timers[part]=setTimeout(()=>{
    const body=JSON.parse(JSON.stringify(S[part]));
    chains[part]=(chains[part]||Promise.resolve()).then(()=>refs[part].set(body)).catch(e=>{
      syncNote = e&&e.code==="quota_exceeded" ? "保存容量がいっぱいです。" : "クラウドへの保存に失敗しました。この端末には保存されています。";
      renderMeta();
    });
  },600);
}

/* ---------------- 日付・乱数 ---------------- */
function ymd(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
const TODAY = ymd(new Date());
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n));}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------------- 問題の選び方 ---------------- */
function allQ(){return BANK;}
function qById(id){return allQ().find(q=>q.id===id);}
function prog(id){return S.st.progress[id];}
function inNote(id){const p=prog(id);return !!(p&&p.w>0&&(p.streak||0)<2);}
function pickRound(seedKey, exclude){
  const r=rng(hashStr(seedKey));
  const pool=allQ().filter(q=>!exclude.has(q.id));
  const due=pool.filter(q=>{const p=prog(q.id);return p&&p.lastWrong&&p.last<TODAY;}).sort((a,b)=>prog(a.id).last<prog(b.id).last?-1:1);
  const unseen=shuffle(pool.filter(q=>!prog(q.id)),r);
  const seen=shuffle(pool.filter(q=>prog(q.id)&&!due.includes(q)),r).sort((a,b)=>{
    const pa=prog(a.id),pb=prog(b.id);const ra=pa.c/(pa.c+pa.w||1),rb=pb.c/(pb.c+pb.w||1);
    return ra-rb || (pa.last<pb.last?-1:1);});
  const picks=due.slice(0,2);
  const used=new Set(picks.map(q=>q.subj));
  for(const q of unseen){if(picks.length>=5)break;if(!used.has(q.subj)){picks.push(q);used.add(q.subj);}}
  for(const q of unseen.concat(seen)){if(picks.length>=5)break;if(!picks.includes(q))picks.push(q);}
  return shuffle(picks,r).map(q=>q.id);
}
function todayRec(){return S.st.days[TODAY];}
function ensureToday(){
  if(!S.st.days[TODAY]){S.st.days[TODAY]={rounds:[]};}
  const d=S.st.days[TODAY];
  if(!d.rounds.length){d.rounds.push({ids:pickRound(TODAY+"#0",new Set()),ans:{},hint:{}});trimDays();saveLocal();}
  return d;
}
function trimDays(){const ks=Object.keys(S.st.days).sort();while(ks.length>400){delete S.st.days[ks.shift()];}}
function roundDone(rd){return rd.ids.every(id=>rd.ans[id]);}
function dayDone(d){return d&&d.rounds&&d.rounds.length&&roundDone(d.rounds[0]);}

/* ---------------- 画面の状態 ---------------- */
let tab="today", sel=null, roundIdx=null, flash="";
const TABS=[["today","今日の5問"],["notes","復習ノート"],["stats","記録"],["settings","設定"]];

const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function streak(){
  let n=0,d=dayDone(S.st.days[TODAY])?TODAY:addDays(TODAY,-1);
  while(dayDone(S.st.days[d])){n++;d=addDays(d,-1);}
  return n;
}
function renderMeta(){
  const [y,m,dd]=TODAY.split("-").map(Number);
  const wd="日月火水木金土"[new Date(y,m-1,dd).getDay()];
  let label=`${m}月${dd}日（${wd}）`;
  const ex=S.st.settings.examDate;
  $("#today-label").textContent=label;
  renderCountdown(ex);
  const tot=Object.values(S.st.progress).reduce((a,p)=>a+p.c+p.w,0);

function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#confetti");c.hidden=false;const ctx=c.getContext("2d");
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cs=getComputedStyle(document.documentElement);
  const cols=["--accent","--lilac","--mint","--sun"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14*devicePixelRatio,vy:(-Math.random()*14-4)*devicePixelRatio,r:(4+Math.random()*5)*devicePixelRatio,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6,heart:Math.random()<.35}));
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.35*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=.1;ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
      if(p.heart){ctx.font=`${p.r*3}px sans-serif`;ctx.fillText("♥",0,0);}else{ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.6,0,0,Math.PI*2);ctx.fill();}
      ctx.restore();});

  })();
}

  if(idx===-1 && !flash) return viewResult(rd,pips);
  const showIdx = flash ? rd.ids.indexOf(flash) : idx;
  const q=qById(rd.ids[showIdx]);
  if(!q) return `<div class="card empty">問題が見つかりませんでした。</div>`;
  const a=rd.ans[q.id];

/* ---------------- 操作 ---------------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;flash="";render();window.scrollTo(0,0);return;}
  const act=t.dataset.act;const rd=tab==="today"?curRound():null;
  if(act==="choose"){sel=Number(t.dataset.i);render();}
  else if(act==="hint"){const id=rd.ids.find(i=>!rd.ans[i]);rd.hint[id]=true;persist("st");render();}
  else if(act==="submit"&&sel!=null){
    const id=rd.ids.find(i=>!rd.ans[i]);const q=qById(id);const ok=sel===q.ans;const h=!!rd.hint[id];
    rd.ans[id]={c:sel,ok,h};
    const p=S.st.progress[id]||(S.st.progress[id]={c:0,w:0,h:0,streak:0});
    if(ok){p.c++;p.streak=(p.streak||0)+1;}else{p.w++;p.streak=0;p.lastChoice=sel;}
    if(h)p.h=(p.h||0)+1;p.lastWrong=!ok;p.last=TODAY;
    flash=id;sel=null;persist("st");render();
  }
  else if(act==="next"){flash="";sel=null;const fin=roundDone(rd);render();window.scrollTo(0,0);if(fin)confetti();}
  else if(act==="more"){
    const d=ensureToday();const used=new Set(d.rounds.flatMap(r=>r.ids));
    let ids=pickRound(TODAY+"#"+d.rounds.length,used);
    if(ids.length<5) ids=pickRound(TODAY+"#"+d.rounds.length,new Set());
    d.rounds.push({ids,ans:{},hint:{}});roundIdx=d.rounds.length-1;flash="";sel=null;persist("st");render();window.scrollTo(0,0);
  }
  else if(act==="practice"){
    const k=t.dataset.subj;const ids=allQ().filter(q=>q.subj===k&&inNote(q.id)).map(q=>q.id);
    const extra=shuffle(allQ().filter(q=>q.subj===k&&!ids.includes(q.id)).map(q=>q.id),rng(Date.now()));
    const d=ensureToday();d.rounds.push({ids:ids.concat(extra).slice(0,5),ans:{},hint:{}});
    roundIdx=d.rounds.length-1;tab="today";flash="";sel=null;persist("st");render();window.scrollTo(0,0);
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="exam"){S.st.settings.examDate=e.target.value;persist("st");renderMeta();}
  if(e.target.id==="time"){S.st.settings.time=e.target.value;persist("st");}
});

/* ---------------- 起動 ---------------- */
if(location.hash){const h=location.hash.slice(1);if(TABS.some(x=>x[0]===h))tab=h;}
ensureToday();
render();
(async()=>{
  if(!window.claude||!window.claude.use) return;
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d;uid=id;
    const col=db.collection("data/users/"+uid);
    refs.st=col.doc("state");
    let changed=false;
    for(const part of ["st"]){
      const snap=await refs[part].get();
      const remote=snap.exists?snap.data():null;
      if(remote&&(remote.updatedAt||0)>(S[part].updatedAt||0)){S[part]=JSON.parse(JSON.stringify(remote));changed=true;}
      else if(S[part].updatedAt>0&&(!remote||(remote.updatedAt||0)<S[part].updatedAt)){persist(part);}
    }
    if(changed){saveLocal();roundIdx=null;flash="";ensureToday();}
    render();
  }catch(e){syncNote="クラウドの記録を読み込めませんでした。この端末の記録を使っています。";render();}
})();
</script>
